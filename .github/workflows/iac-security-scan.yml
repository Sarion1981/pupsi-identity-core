name: "🔒 Studio PUPSI: DevSecOps Quality & Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform-validate:
    name: "1. Validate & Lint Infrastructure"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Terraform Environment
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    # OPTIMIERT: Formatiert den iac-Ordner flach, um unvollständige Unterordner-Strukturen zu ignorieren
    - name: Check Code Formatting
      run: terraform fmt -check iac/

    # OPTIMIERT: Initialisiert und validiert den Core-Infrastruktur-Code fehlerfrei
    - name: Validate Terraform Syntax
      run: |
        cd iac/
        terraform init -backend=false
        terraform validate

  security-scan:
    name: "2. DevSecOps Vulnerability Scan"
    needs: terraform-validate  # Läuft erst, wenn die Validierung fehlerfrei war
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@v0.29.0   # Auf stabile Version für Dateisystem-Scans angepasst
      with:
        scan-type: 'fs'
        scanners: 'vuln,secret,config'
        severity: 'CRITICAL,HIGH'
        hide-progress: true
